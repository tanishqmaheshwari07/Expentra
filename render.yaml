services:
  # Backend - Spring Boot API
  - type: web
    name: expensetracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    healthCheckPath: /actuator/health

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: expensetracker-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: expensetracker-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: expensetracker-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: expensetracker-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: expensetracker-db
          property: password

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRATION_MS
        value: "900000"

      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"

      - key: COOKIE_SECURE
        sync: false

      - key: COOKIE_SAME_SITE
        sync: false

      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

      - key: APP_FRONTEND_URL
        sync: false

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        sync: false

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_AUTH
        sync: false

      - key: MAIL_STARTTLS_ENABLE
        sync: false

      - key: MAIL_STARTTLS_REQUIRED
        sync: false

      - key: MAIL_FROM
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: OAUTH2_REDIRECT_URI
        sync: false

      - key: OAUTH2_FAILURE_REDIRECT_URI
        sync: false

  # Frontend - React + Vite
  - type: web
    name: expensetracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://expensetracker-api.onrender.com/api

databases:
  - name: expensetracker-db
    databaseName: expense_tracker
    user: expenseuser
    region: oregon