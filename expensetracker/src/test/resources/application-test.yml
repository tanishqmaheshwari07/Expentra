spring:
  application:
    name: expensetracker-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            client-authentication-method: client_secret_post
            redirect-uri: "{baseScheme}://{baseHost}{basePort}{basePath}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

application:
  users:
    unverified-cleanup-enabled: false
    unverified-cleanup-dry-run: true
    unverified-cleanup-days: 7

  oauth2:
    cookie-secret: "test-oauth2-cookie-hmac-secret-key-32-bytes-long"
    authorized-redirect-uri: http://localhost:3000/oauth2/callback
    failure-redirect-uri: http://localhost:3000/login?error=oauth_failed
    exchange-code-expiration-seconds: 300

  security:
    jwt:
      secret-key: "test-jwt-signing-secret-key-obviously-fake-and-at-least-32-chars-long"
      access-token-expiration-ms: 3600000
      refresh-token-expiration-ms: 86400000

  mail:
    from: noreply@expensetracker.local
    frontend-url: http://localhost:3000
    verification-expiration-minutes: 30
    resend-cooldown-seconds: 60